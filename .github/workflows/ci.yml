name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build
      - run: python scripts/validate_release_artifacts.py
      - run: python -m pip install -e .[dev]
      - run: python -m unittest discover -s tests -q
      - run: python -m compileall -q src tests app.py discogs_client.py
      - name: Validate changed-content whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
            git diff --check "${base}..HEAD"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            git diff-tree --root --check -r HEAD
          else
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          fi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build
      - run: python scripts/validate_release_artifacts.py
      - run: python -m pip install -e .[dev]
      - run: python -m unittest discover -s tests -q
      - run: python -m compileall -q src tests app.py discogs_client.py
      - name: Validate changed-content whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
            git diff --check "${base}..HEAD"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            git diff-tree --root --check -r HEAD
          else
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          fi
